[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "routeit-platform"
version = "5.0.0"
description = "Route.it TD-CVRPTW Intelligent Fleet Routing & Optimization Platform (Q-HGALS 5.0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
solvers = ["ortools>=9.6"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["engine", "reference", "roads", "traffic", "backend"]
